<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dhyey · Walk Through It</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter+Tight:wght@400;600;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Scene 0: gate -->
  <section id="gate">
    <div class="gate-inner">
      <p class="mono dim">🎧 headphones on</p>
      <button id="enter" class="mono">tap to enter<span class="caret">_</span></button>
    </div>
  </section>

  <!-- Scene 1: white + spoken captions -->
  <section id="intro" aria-live="polite">
    <div id="caption"></div>
  </section>

  <!-- Circle-reveal ring -->
  <div id="ring"></div>

  <!-- Scene 3: 3D journey -->
  <canvas id="world"></canvas>

  <!-- "open board" prompt when standing at a stop -->
  <button id="prompt" class="mono"><b>✎</b> <span></span> <em>open board</em></button>

  <!-- the scientist's whiteboard -->
  <section id="board" aria-hidden="true" role="dialog" aria-label="Whiteboard">
    <svg width="0" height="0" style="position:absolute">
      <defs>
        <filter id="chalk"><feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/></filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#f6f4ef" stroke-width="1.6" stroke-linecap="round"/></marker>
      </defs>
    </svg>
    <div class="board-tools mono">
      <button data-draw aria-pressed="false">✎ draw on it</button>
      <button data-erase>erase</button>
      <button data-close>close ✕</button>
    </div>
    <div class="board-inner"></div>
    <canvas id="chalkpad"></canvas>
  </section>
  <div id="hud" class="mono">
    <span id="stage-name"></span>
    <span class="mono hint">scroll or ← → to walk · click a board</span>
    <span id="progress"><b></b></span>
  </div>
  <div id="scroll-space"></div>

  <audio id="bg" src="audio/bg.mp3" preload="auto"></audio>
  <audio id="bg2" src="audio/bg2.mp3" preload="auto"></audio>
  <audio id="voice" preload="auto"></audio>
  <audio id="amb" src="audio/ambient.mp3" preload="auto" loop></audio>

  <script src="vendor/gsap.min.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
