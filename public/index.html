<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dhyey · Walk Through It</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Scene 0: gate -->
  <section id="gate">
    <div class="gate-inner">
      <p class="mono dim">🎧 headphones on</p>
      <button id="enter" class="mono">tap to enter<span class="caret">_</span></button>
    </div>
  </section>

  <!-- Scene 1: white + spoken captions -->
  <section id="intro" aria-live="polite">
    <div id="caption"></div>
  </section>

  <!-- Circle-reveal ring -->
  <div id="ring"></div>

  <!-- Scene 3: 3D journey -->
  <canvas id="world"></canvas>
  <div id="labels"></div>
  <div id="hud" class="mono">
    <span id="stage-name"></span>
    <span id="progress"><b></b></span>
  </div>
  <div id="scroll-space"></div>

  <audio id="bg" src="audio/bg.mp3" preload="auto"></audio>
  <audio id="bg2" src="audio/bg2.mp3" preload="auto"></audio>
  <audio id="voice" preload="auto"></audio>
  <audio id="amb" src="audio/ambient.mp3" preload="auto" loop></audio>

  <script src="vendor/gsap.min.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
